# Gateway HTTPS 인증서 (사설 CA ClusterIssuer homelab-ca, manifests/cert-manager-issuers/)
# Gateway와 같은 네임스페이스(istio-system)에 secret을 만들어 listener가 바로 참조한다.
# 기본 https listener(home.awx.kr, www.home.awx.kr) 전용이다. 호스트 전용 listener는 각자 전용 인증서를 쓴다.
# 다른 호스트 이름(*.awx.kr 등)을 넣지 않는다: 여러 listener가 덮는 인증서를 쓰면 브라우저가 HTTP/2 연결을
# 다른 호스트에 재사용하고, Istio Gateway는 처음 연결한 호스트(SNI) 기준으로 라우팅해 404를 낸다(PR #47에서 확인).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: istio-gateway-tls
  namespace: istio-system
spec:
  secretName: istio-gateway-tls
  commonName: home.awx.kr
  dnsNames:
    - home.awx.kr
    - www.home.awx.kr
  duration: 2160h           # 90일
  renewBefore: 360h         # 15일 전 갱신
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: homelab-ca
