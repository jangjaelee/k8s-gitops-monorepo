# https://argocd.awx.kr → Istio Gateway(ServiceLB → 127.0.0.1, listener https-argocd) → Service argocd-server:80
# argocd-server는 server.insecure=true(helm/argocd/values.yaml)로 평문 HTTP를 받는다.
# CLI(gRPC)는 HTTP/1.1로 감싸는 --grpc-web을 쓴다: argocd login argocd.awx.kr --grpc-web
# group/kind/weight/matches는 API 서버 기본값을 그대로 적어 둔다(없으면 Argo CD가 OutOfSync로 봄).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argo-cd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio-gateway
      namespace: istio-system
      sectionName: https-argocd
  hostnames:
    - argocd.awx.kr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
