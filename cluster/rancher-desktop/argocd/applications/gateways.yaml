apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateways
  namespace: argo-cd
spec:
  project: system
  source:
    repoURL: https://github.com/jangjaelee/k8s-gitops-monorepo.git
    targetRevision: main
    path: cluster/rancher-desktop/manifests/gateways
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
