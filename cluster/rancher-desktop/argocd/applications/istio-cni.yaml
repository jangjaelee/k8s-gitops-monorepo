apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argo-cd
spec:
  project: system
  sources:
    - repoURL: https://blob.istio.io/istio-release/charts   # 1.31부터 GCP 저장소 폐지(차단 시험 11-17·12-08), https://istio.io/latest/blog/2026/retirement-of-gcp/
      chart: cni
      targetRevision: 1.30.3
      helm:
        releaseName: istio-cni
        valueFiles:
          - $values/cluster/rancher-desktop/helm/istio-cni/values.yaml
    - repoURL: https://github.com/jangjaelee/k8s-gitops-monorepo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
