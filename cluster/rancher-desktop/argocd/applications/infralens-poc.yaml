apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infralens-poc
  namespace: argo-cd
spec:
  project: default                    # 제품(InfraLens) 앱이라 시스템 구성요소(system)와 구분
  sources:
    - repoURL: git@github.com:jangjaelee/infralens.git   # 비공개. 읽기 전용 배포 키 Secret argo-cd/repo-infralens(레포에 넣지 않음, README "InfraLens PoC" 절)
      path: deploy/helm/infralens
      targetRevision: 88dc0a5747de6e3f91a5fc67755b9e143f3ec29a   # 개발 중 커밋 고정(main 금지). 릴리스 때는 태그로 바꾸고 아래 parameters를 지운다
      helm:
        releaseName: infralens
        # 커밋으로 올릴 때는 image.tag를 values 파일이 아니라 여기 둔다. values는 머지 즉시 자동 sync되고 targetRevision은
        # 이 파일을 kubectl apply해야 반영되므로, 따로 두면 그 사이 차트와 이미지가 어긋난다. 릴리스 태그면 appVersion을 쓰므로 두지 않는다.
        parameters:
          - name: image.tag
            value: sha-88dc0a5
        valueFiles:
          - $values/cluster/rancher-desktop/helm/infralens-poc/values.yaml
    - repoURL: https://github.com/jangjaelee/k8s-gitops-monorepo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: infralens              # 네임스페이스와 차트 밖 리소스(infralens-pg, 비밀 Secret)는 InfraLens 쪽이 관리
  syncPolicy:
    # prune은 이 앱이 추적하는 리소스(차트 렌더링 결과)만 지운다. 차트 밖 infralens-pg·Secret·poc-* Job은 대상이 아니다.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
