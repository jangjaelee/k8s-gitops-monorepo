# chart: jangjaelee/infralens(비공개) deploy/helm/infralens 0.2.0 @ 290f74b  (Argo CD app: argocd/applications/infralens-poc.yaml)
# InfraLens PoC 설치. 릴리스된 제품을 GitOps로 설치하는 상황을 가정한다. 값은 Helm 릴리스 rev 9와 같다(image.tag 제외).
# 비밀값은 없다. existingSecret은 Secret 이름만 가리키고, Secret은 InfraLens 쪽이 infralens ns에 만든다.
# image.tag는 여기 두지 않는다: 릴리스 차트는 appVersion을 쓰고, 커밋으로 올릴 때는 Application의 helm.parameters에 둔다.
# 이미지 레지스트리: Docker Hub(docker.io/cine0831) 대신 GHCR(Public 패키지, Pull Secret 불필요). home-k8s와 같게 맞춘다
image:
  registry: ghcr.io/jangjaelee
app:
  enabled: true
  publicUrl: https://infralens.awx.kr
  sso:
    adminSubjects:
    - CiQwMDAwMDAwMC0wMDAwLTAwMDAtMDAwMC0wMDAwMDAwMDAwMDESBWxvY2Fs
    allowAllUsers: true
    ca:
      existingSecret: infralens-gw-ca
      key: ca.crt
    clientId: infralens
    clientSecret:
      existingSecret: infralens-sso
    issuer: https://infralens.awx.kr/dex
  trustedProxyCIDRs:
  - 10.42.0.0/16                 # k3s 기본 Pod CIDR(Flannel)
  - 127.0.0.6/32                 # Istio 사이드카가 넘기는 연결 주소(docs/installation.md "Istio 사이드카를 넣을 때")
  # 2026-10-29 Istio 사이드카 주입(InfraLens Istio 화면용). app·web·kube-gateway만, PostgreSQL·수집 CronJob은 넣지 않음
  podLabels:
    sidecar.istio.io/inject: "true"
  # 사이드카 자원(주입 기본 100m·128Mi / 2·1Gi가 실사용 5m·55Mi에 비해 과함, 2026-10-29). 넷을 함께 넣는다
  podAnnotations:
    sidecar.istio.io/proxyCPU: "20m"
    sidecar.istio.io/proxyCPULimit: "500m"
    sidecar.istio.io/proxyMemory: "64Mi"
    sidecar.istio.io/proxyMemoryLimit: "256Mi"
database:
  app:
    existingSecret: infralens-db-app
  loader:
    existingSecret: infralens-db-loader
  migrator:
    existingSecret: infralens-db-migrator
  llm:
    existingSecret: infralens-db-llm           # AI 채팅 전용 DB 계정(키 url)
encryption:
  existingSecret: infralens-encryption
rbac:
  inClusterCollector:
    enabled: true
routing:
  gateway:
    enabled: true
    parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio-gateway
      namespace: istio-system
      sectionName: https-infralens
web:
  enabled: true
  podLabels:
    sidecar.istio.io/inject: "true"
  podAnnotations:
    sidecar.istio.io/proxyCPU: "20m"
    sidecar.istio.io/proxyCPULimit: "500m"
    sidecar.istio.io/proxyMemory: "64Mi"
    sidecar.istio.io/proxyMemoryLimit: "256Mi"
# 게이트웨이 시작 때 Map 기본 종류 14개 + node·event·namespace를 켜 두고 끄지 않는다. 나머지는 1시간 안 보면 끈다.
# 캐시가 idle로 꺼진 뒤 첫 응답이 빈 캐시라 개요(/kube/in-cluster)에서 워크로드가 0으로 보이던 문제를 PoC에서 피한다.
kube:
  # 2026-10-29 켬: 3D 지도·Istio 화면이 Prometheus(연결 관리에서 정함)의 Istio 지표를 읽음. 꺼져 있으면 메시 응답이 traffic_disabled. Hubble은 없음(Flannel)
  traffic:
    enabled: true
  # 2026-10-29 켬: Kubernetes 이력 적재(AI 채팅의 Kubernetes 이력 질의용). 게이트웨이가 10분마다 in-cluster를 읽어 raw에 버전을 쌓음.
  # 적재기 DB 비밀 infralens-db-loader를 게이트웨이에 넣음. 단일 클러스터라 보존은 차트 기본 30일
  history:
    enabled: true
  gateway:
    podLabels:
      sidecar.istio.io/inject: "true"
    podAnnotations:
      sidecar.istio.io/proxyCPU: "20m"
      sidecar.istio.io/proxyCPULimit: "500m"
      sidecar.istio.io/proxyMemory: "64Mi"
      sidecar.istio.io/proxyMemoryLimit: "256Mi"
  # 접근 현황(누가 어떤 권한을 가졌는지). 켜도 렌더링은 app·kube-gateway env INFRALENS_KUBE_ACCESS_ENABLED만 바뀜(새 RBAC 없음). 보는 최소 역할은 차트 기본 admin. 2026-10-21 켬
  access:
    enabled: true
  # SNAT 판정. rancher-desktop은 Flannel이라 Calico IPPool이 없음 → 수집기 ClusterRole에 ippools 규칙을 넣지 않는다. 2026-10-23 사용자 결정
  snat:
    calico: false
  # 연결 시험의 서비스 메시·멀티클러스터 판정(차트 기본 true). 수집기 ClusterRole에 MCS·Linkerd Link·Submariner 읽기 규칙이 더해진다(Secret 권한 없음). 2026-10-23 사용자 결정으로 켬
  mesh:
    enabled: true
  cache:
    idleStopAfter: 1h
    warm: [pod, deployment, replicaset, statefulset, daemonset, job, cronjob, horizontalpodautoscaler, service, endpointslice, ingress, ingressclass, networkpolicy, persistentvolumeclaim, node, event, namespace]
# AI 채팅. 조직 키 Secret 없이 사용자 키(BYOK)만 쓴다: 로그인한 사용자가 화면에서 자기 LLM API 키를 넣는다
# (encryption 키 링으로 암호화, 최대 30일 보관). 모델 이름은 사용자 키에도 쓴다.
# 켜면 API 서버에 LLM env가 붙고 종료 유예가 길어지며(응답 스트림 마무리), 주간 평가 CronJob infralens-llm-eval이 생긴다.
llm:
  enabled: true
  primary: anthropic
  secondary: openai
  anthropic:
    model: claude-sonnet-5-5
  openai:
    model: gpt-6-luna
    reasoningEffort: none          # Chat Completions에서 tool을 쓰려면 필요(차트 #355)
  orgKey:
    enabled: false                # 조직 키가 없으므로 사용자 키가 없으면 채팅을 쓰지 않는다(예전 byok.orgKeyFallback: false, ADR-0015)
  byok:
    enabled: true
  # 비용 절감(2026-10-20, 개인 선불 크레딧이 시간당 약 0.7달러 줄어서): 월 토큰·사용자별 요청 한도를 낮추고 주간 평가를 끈다.
  limits:
    monthlyTokenBudget: 1000000
    userHourly: 10                # 차트 기본 30
    userDaily: 30                 # 차트 기본 200
  eval:
    enabled: false                # 주간 평가 CronJob을 두지 않는다. 필요할 때 사용자 승인 뒤 수동으로 돌린다
