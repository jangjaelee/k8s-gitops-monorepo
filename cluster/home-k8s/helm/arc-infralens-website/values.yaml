# chart: actions-runner-controller-charts/gha-runner-scale-set 0.15.0 (ARC 0.15.0, OCI ghcr.io/actions/actions-runner-controller-charts)  (Argo CD app: argocd/applications/arc-infralens-website.yaml)
# 문서 사이트 레포 infralens-website 전용 러너 스케일 셋(2026-11-23 PM 승인, GitHub 호스트 러너 결제 한도로 이전). 워크플로: runs-on: arc-infralens-website
# 잡: Hugo·htmltest 받아 빌드(15분 상한, 동시 1~2개). 구성은 arc-infralens-light와 같다(노드 02·03, 같은 이미지·GitHub App Secret)
githubConfigUrl: https://github.com/jangjaelee/infralens-website
githubConfigSecret: arc-infralens-github-app   # GitHub App 자격 증명 Secret(manifests/arc-infralens/external-secret.yaml), 앱이 이 레포에도 설치되어 있어야 한다
runnerScaleSetName: arc-infralens-website

minRunners: 0
maxRunners: 2
# Argo CD는 helm lookup을 못 하므로 컨트롤러 ServiceAccount를 직접 적는다(helm/arc-controller/values.yaml, release arc)
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi

# containerMode를 쓰지 않고 dind 구성을 직접 적는다(차트의 dind 모드는 docker:dind 태그·리소스를 바꿀 수 없다).
# 구조는 차트 dind 모드와 같다: externals 복사 init → dind 네이티브 사이드카 → runner
template:
  spec:
    automountServiceAccountToken: false   # 러너에 클러스터 API 자격 증명을 주지 않는다(SA도 권한 없는 gha-rs-no-permission)
    # CI 전용 노드(worker-node-04·05·06, taint dedicated=ci:NoSchedule, 라벨 node-role.kubernetes.io/ci)를 먼저 채우고,
    # 넘치면 라벨 awx.kr/runner-overflow=<노드 이름>이 붙은 일반 노드(지금 worker-node-02·03)에 노드당 1개까지만 띄운다.
    # worker-node-06(8코어)에도 이 라벨을 붙여 1개로 제한한다(2026-11-03).
    # taint·라벨은 kubectl로 붙인다(README "CI 전용 노드").
    # 서비스보다 낮은 우선순위(manifests/arc-infralens/priorityclass.yaml, preemptionPolicy Never): 러너는 남을 밀지 않고,
    # 자리가 모자라면 서비스 Pod가 러너를 밀어낼 수 있다(그때 그 CI 잡은 실패).
    priorityClassName: ci-runner-low
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: awx.kr/runner-light       # worker-node-02·03 (PoC가 있는 01은 제외)
                  operator: Exists
    initContainers:
      # Go·npm·툴체인·Playwright 캐시 hostPath(아래 go-cache·npm-cache·toolcache·playwright-cache)는 root 소유로 만들어지므로 러너 사용자가 쓸 수 있게 디렉터리만 넘긴다(캐시 내용은 재귀로 건드리지 않는다)
      - name: init-go-cache
        image: &runnerImage ghcr.io/jangjaelee/arc-runner:2.338.2-367ec22@sha256:c0bf0484d7fda2cc1e117ca0ef8612114658381d30e38af9859fa12dc081041c
        command: ["sh", "-c", "mkdir -p /ci-cache/go/mod /ci-cache/go/build /ci-cache/ms-playwright /ci-cache/npm /ci-cache/toolcache && chown \"$(id -u runner):$(id -g runner)\" /ci-cache/go /ci-cache/go/mod /ci-cache/go/build /ci-cache/ms-playwright /ci-cache/npm /ci-cache/toolcache"]
        securityContext:
          runAsUser: 0
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
          - name: go-cache
            mountPath: /ci-cache/go
          - name: playwright-cache
            mountPath: /ci-cache/ms-playwright
          - name: npm-cache
            mountPath: /ci-cache/npm
          - name: toolcache
            mountPath: /ci-cache/toolcache
      - name: init-dind-externals
        image: *runnerImage
        command: ["cp"]
        args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        # 복사 중 페이지 캐시가 cgroup 메모리로 잡혀 256Mi에서 cp가 OOM으로 죽었다(worker-node-05, 2026-10-28 4건) → limit 512Mi
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      - name: dind
        image: docker.io/library/docker:29.9.1-dind@sha256:3e5756e2b6dad6a5f1f5deacf0a19f9eaa2581b76ae092b2d4a118162e1d4d4e
        restartPolicy: Always           # 네이티브 사이드카: runner가 끝나면 함께 종료
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
          # Docker Hub 받기를 ci-cache 미러로(manifests/ci-cache). HTTP라 insecure로도 등록한다. 미러가 실패하면 dockerd가 Docker Hub로 바로 간다.
          # buildx docker-container 드라이버(buildkitd)는 이 설정을 쓰지 않으므로 워크플로가 아래 runner env로 buildkitd 설정을 만든다
          - --registry-mirror=http://registry-mirror.ci-cache.svc.cluster.local:5000
          - --insecure-registry=registry-mirror.ci-cache.svc.cluster.local:5000
          - --insecure-registry=build-cache.ci-cache.svc.cluster.local:5000
          # GHCR 받기 미러. --registry-mirror는 Docker Hub 전용이라 워크플로가 INFRALENS_CI_GHCR_MIRROR 주소로 직접 pull한다(HTTP라 insecure)
          - --insecure-registry=ghcr-mirror.ci-cache.svc.cluster.local:5000
        env:
          - name: DOCKER_GROUP_GID
            value: "123"                # 러너 이미지의 docker 그룹
        securityContext:
          privileged: true
        startupProbe:
          exec:
            command: ["docker", "info"]
          failureThreshold: 24
          periodSeconds: 5
        # 메모리: 4.5일 실사용 최대 491Mi(2026-10-27) → request 2Gi→512Mi, limit 4Gi→1Gi(약 2배 여유). 이미지 빌드가 여기서 돈다
        resources:
          requests:
            cpu: 250m           # 가벼운 잡은 dind를 거의 안 씀(실측 평균 0.06코어)
            memory: 128Mi
          limits:
            memory: 1Gi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: dind-storage
            mountPath: /var/lib/docker
    containers:
      - name: runner
        image: *runnerImage
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
          # Go 모듈·빌드 캐시를 노드 디스크에 둔다. 워크플로는 INFRALENS_CI_LOCAL_GO_CACHE=1이면 setup-go 캐시(Actions 캐시 608 MiB 받기)를 끈다
          - name: GOMODCACHE
            value: /ci-cache/go/mod
          - name: GOCACHE
            value: /ci-cache/go/build
          - name: INFRALENS_CI_LOCAL_GO_CACHE
            value: "1"
          # Playwright 브라우저를 노드 디스크에 둔다(npx playwright install이 이미 있는 버전은 건너뜀). e2e 잡이 20분 timeout에 걸리던 설치 시간을 줄인다
          - name: PLAYWRIGHT_BROWSERS_PATH
            value: /ci-cache/ms-playwright
          # ci-cache 레지스트리 주소(host:port, HTTP). 워크플로가 buildkitd 미러 설정과 --cache-to/--cache-from type=registry에 쓴다
          - name: INFRALENS_CI_DOCKERHUB_MIRROR
            value: registry-mirror.ci-cache.svc.cluster.local:5000
          - name: INFRALENS_CI_BUILD_CACHE
            value: build-cache.ci-cache.svc.cluster.local:5000
          # GHCR 공개 이미지 받기 미러(manifests/ci-cache/ghcr-mirror.yaml). 워크플로가 ghcr.io 대신 이 주소로 pull하고, 실패하면 ghcr.io로 바로 간다
          - name: INFRALENS_CI_GHCR_MIRROR
            value: ghcr-mirror.ci-cache.svc.cluster.local:5000
          # npm 패키지는 ci-cache npm 프록시(Verdaccio, manifests/ci-cache/npm-proxy.yaml)로 받고 npm 캐시는 노드 디스크에 둔다.
          # 프록시가 죽어 npm install이 실패하면 워크플로 단계에서 npm_config_registry를 비워 npmjs로 바로 간다
          - name: npm_config_registry
            value: http://npm-proxy.ci-cache.svc.cluster.local:4873/
          - name: npm_config_cache
            value: /ci-cache/npm
        resources:
          requests:
            cpu: 750m           # runner+dind 합 1코어(PM 결정 11-15)
            memory: 384Mi       # runner+dind 합 약 0.5Gi
          limits:
            memory: 3Gi         # 가벼운 잡 실측 최대 2.1Gi(web lint·type·test·build)
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: go-cache
            mountPath: /ci-cache/go
          - name: playwright-cache
            mountPath: /ci-cache/ms-playwright
          - name: npm-cache
            mountPath: /ci-cache/npm
          # 툴체인(setup-go·setup-node)이 받는 Go·Node. 러너가 RUNNER_TOOL_CACHE를 작업 디렉터리 아래 _tool로 정하므로 env 대신 그 경로에 마운트한다
          # (work emptyDir 안 하위 마운트라 잡이 끝나도 노드 디스크에 남는다)
          - name: toolcache
            mountPath: /home/runner/_work/_tool
    volumes:
      # 노드별 Go 캐시. 일반 워커로 넘친 러너는 그 노드의 (처음엔 빈) 캐시를 쓴다. 여러 러너가 동시에 써도 Go가 잠금을 건다.
      # 잡 사이에 남으므로 InfraLens 저장소를 공개로 바꾸기 전에 이 스케일 셋과 함께 없앤다(위 4행). 비우려면 노드에서 이 디렉터리를 지운다.
      - name: go-cache
        hostPath:
          path: /var/lib/ci-cache/go
          type: DirectoryOrCreate
      # 브라우저 버전마다 약 0.5~1GB. 자동 정리는 없다(오래된 버전 디렉터리는 수동 정리, 점검 때 크기 확인)
      - name: playwright-cache
        hostPath:
          path: /var/lib/ci-cache/ms-playwright
          type: DirectoryOrCreate
      # npm 다운로드 캐시(_cacache). 노드별, 자동 정리 없음(필요하면 노드에서 디렉터리를 지운다)
      - name: npm-cache
        hostPath:
          path: /var/lib/ci-cache/npm
          type: DirectoryOrCreate
      # setup-go·setup-node 툴체인 캐시(Go·Node 판마다 수십~수백 MB). 자동 정리 없음, 오래된 판은 수동 정리
      - name: toolcache
        hostPath:
          path: /var/lib/ci-cache/toolcache
          type: DirectoryOrCreate
      - name: work
        emptyDir:
          sizeLimit: 20Gi
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: dind-storage              # 이미지·빌드 캐시. 러너가 지워지면 함께 사라진다
        emptyDir:
          sizeLimit: 40Gi
