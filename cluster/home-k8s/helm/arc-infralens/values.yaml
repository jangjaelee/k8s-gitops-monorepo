# chart: actions-runner-controller-charts/gha-runner-scale-set 0.15.0 (ARC 0.15.0, OCI ghcr.io/actions/actions-runner-controller-charts)  (Argo CD app: argocd/applications/arc-infralens.yaml)
# jangjaelee/infralens(비공개) 저장소 전용 러너 스케일 셋. 워크플로: runs-on: arc-infralens (InfraLens는 저장소 변수 CI_RUNNER로 지정)
# 러너는 잡 하나만 돌고 지워진다(ephemeral). Docker는 DinD 사이드카(privileged)로 제공한다.
# InfraLens 저장소를 공개로 바꾸기 전에 이 스케일 셋을 지운다(공개 저장소의 fork PR이 self-hosted 러너에서 돌 수 있다).
githubConfigUrl: https://github.com/jangjaelee/infralens
githubConfigSecret: arc-infralens-github-app   # GitHub App 자격 증명 Secret(manifests/arc-infralens/external-secret.yaml)
runnerScaleSetName: arc-infralens

minRunners: 0
# 러너 Pod 하나가 requests 3.5 CPU·3.5Gi를 쓴다(runner 2.5 CPU·3Gi + dind 1 CPU·512Mi, 아래 template).
# limits는 메모리 7Gi(runner 6Gi + dind 1Gi), 디스크 emptyDir 최대 60Gi(work 20Gi + dind-storage 40Gi).
# 수용(2026-10-29): worker-node-04 4개(CPU 기준, 3.5×4=14 / 16), worker-node-05 8개(메모리 기준),
# 넘침 노드 worker-node-02 1개 = 13개. 2026-10-29 runner CPU 2→2.5: 몰릴 때 node-04가 CPU 포화(PSI cpu avg10 71%, load 50)라 5→4개로 줄임. worker-node-01(PoC DB와 같은 디스크)·03(디스크 여유 부족)은 넘침에서 뺐다(아래 affinity).
maxRunners: 13

# Argo CD는 helm lookup을 못 하므로 컨트롤러 ServiceAccount를 직접 적는다(helm/arc-controller/values.yaml, release arc)
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi

# containerMode를 쓰지 않고 dind 구성을 직접 적는다(차트의 dind 모드는 docker:dind 태그·리소스를 바꿀 수 없다).
# 구조는 차트 dind 모드와 같다: externals 복사 init → dind 네이티브 사이드카 → runner
template:
  spec:
    automountServiceAccountToken: false   # 러너에 클러스터 API 자격 증명을 주지 않는다(SA도 권한 없는 gha-rs-no-permission)
    # CI 전용 노드(worker-node-04·05, taint dedicated=ci:NoSchedule, 라벨 node-role.kubernetes.io/ci)를 먼저 채우고,
    # 넘치면 라벨 awx.kr/runner-overflow=<노드 이름>이 붙은 일반 노드(지금 worker-node-02)에 노드당 1개까지만 띄운다.
    # taint·라벨은 kubectl로 붙인다(README "CI 전용 노드").
    # 서비스보다 낮은 우선순위(manifests/arc-infralens/priorityclass.yaml, preemptionPolicy Never): 러너는 남을 밀지 않고,
    # 자리가 모자라면 서비스 Pod가 러너를 밀어낼 수 있다(그때 그 CI 잡은 실패).
    priorityClassName: ci-runner-low
    tolerations:
      - key: dedicated
        operator: Equal
        value: ci
        effect: NoSchedule
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:              # 두 항은 OR
            - matchExpressions:
                - key: node-role.kubernetes.io/ci
                  operator: Exists
            - matchExpressions:
                - key: awx.kr/runner-overflow
                  operator: Exists
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/ci
                  operator: Exists
      # 넘침 노드에서는 러너끼리 같은 노드에 뜨지 않는다. 노드마다 라벨 값이 달라 노드당 1개가 되고,
      # 이 라벨이 없는 CI 노드는 이 제한을 받지 않는다(2026-10-2x lab에서 확인)
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                actions.github.com/scale-set-name: arc-infralens
            topologyKey: awx.kr/runner-overflow
    initContainers:
      # Go·Playwright 캐시 hostPath(아래 go-cache·playwright-cache)는 root 소유로 만들어지므로 러너 사용자가 쓸 수 있게 디렉터리만 넘긴다(캐시 내용은 재귀로 건드리지 않는다)
      - name: init-go-cache
        image: &runnerImage ghcr.io/jangjaelee/arc-runner:2.338.0-e80c90f@sha256:20d7f4c4464c841ee5e27d85b0ad9078c65f3f0315ba92aefbeff19a5f4eeb50
        command: ["sh", "-c", "mkdir -p /ci-cache/go/mod /ci-cache/go/build /ci-cache/ms-playwright && chown \"$(id -u runner):$(id -g runner)\" /ci-cache/go /ci-cache/go/mod /ci-cache/go/build /ci-cache/ms-playwright"]
        securityContext:
          runAsUser: 0
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
          - name: go-cache
            mountPath: /ci-cache/go
          - name: playwright-cache
            mountPath: /ci-cache/ms-playwright
      - name: init-dind-externals
        image: *runnerImage
        command: ["cp"]
        args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        # 복사 중 페이지 캐시가 cgroup 메모리로 잡혀 256Mi에서 cp가 OOM으로 죽었다(worker-node-05, 2026-10-28 4건) → limit 512Mi
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      - name: dind
        image: docker.io/library/docker:29.9.1-dind@sha256:3e5756e2b6dad6a5f1f5deacf0a19f9eaa2581b76ae092b2d4a118162e1d4d4e
        restartPolicy: Always           # 네이티브 사이드카: runner가 끝나면 함께 종료
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
          # Docker Hub 받기를 ci-cache 미러로(manifests/ci-cache). HTTP라 insecure로도 등록한다. 미러가 실패하면 dockerd가 Docker Hub로 바로 간다.
          # buildx docker-container 드라이버(buildkitd)는 이 설정을 쓰지 않으므로 워크플로가 아래 runner env로 buildkitd 설정을 만든다
          - --registry-mirror=http://registry-mirror.ci-cache.svc.cluster.local:5000
          - --insecure-registry=registry-mirror.ci-cache.svc.cluster.local:5000
          - --insecure-registry=build-cache.ci-cache.svc.cluster.local:5000
        env:
          - name: DOCKER_GROUP_GID
            value: "123"                # 러너 이미지의 docker 그룹
        securityContext:
          privileged: true
        startupProbe:
          exec:
            command: ["docker", "info"]
          failureThreshold: 24
          periodSeconds: 5
        # 메모리: 4.5일 실사용 최대 491Mi(2026-10-27) → request 2Gi→512Mi, limit 4Gi→1Gi(약 2배 여유). 이미지 빌드가 여기서 돈다
        resources:
          requests:
            cpu: "1"
            memory: 512Mi
          limits:
            memory: 1Gi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: dind-storage
            mountPath: /var/lib/docker
    containers:
      - name: runner
        image: *runnerImage
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
          # Go 모듈·빌드 캐시를 노드 디스크에 둔다. 워크플로는 INFRALENS_CI_LOCAL_GO_CACHE=1이면 setup-go 캐시(Actions 캐시 608 MiB 받기)를 끈다
          - name: GOMODCACHE
            value: /ci-cache/go/mod
          - name: GOCACHE
            value: /ci-cache/go/build
          - name: INFRALENS_CI_LOCAL_GO_CACHE
            value: "1"
          # Playwright 브라우저를 노드 디스크에 둔다(npx playwright install이 이미 있는 버전은 건너뜀). e2e 잡이 20분 timeout에 걸리던 설치 시간을 줄인다
          - name: PLAYWRIGHT_BROWSERS_PATH
            value: /ci-cache/ms-playwright
          # ci-cache 레지스트리 주소(host:port, HTTP). 워크플로가 buildkitd 미러 설정과 --cache-to/--cache-from type=registry에 쓴다
          - name: INFRALENS_CI_DOCKERHUB_MIRROR
            value: registry-mirror.ci-cache.svc.cluster.local:5000
          - name: INFRALENS_CI_BUILD_CACHE
            value: build-cache.ci-cache.svc.cluster.local:5000
        resources:
          requests:
            cpu: "2.5"          # 빌드·테스트가 여기서 돈다(실사용 최대 5.5코어). 2026-10-21 1→2, 2026-10-29 2→2.5(node-04 러너 5→4)
            memory: 3Gi         # 2026-10-28 2Gi→3Gi(노드에 자리를 더 잡아 둔다, 상한은 그대로)
          limits:
            memory: 6Gi         # 2026-10-29 4Gi→6Gi: web e2e(Playwright chrome-headless)가 node-05에서 4Gi에 걸려 OOMKilled(03:16·13:05·13:08). 요청은 그대로라 배치 불변
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: go-cache
            mountPath: /ci-cache/go
          - name: playwright-cache
            mountPath: /ci-cache/ms-playwright
    volumes:
      # 노드별 Go 캐시. 일반 워커로 넘친 러너는 그 노드의 (처음엔 빈) 캐시를 쓴다. 여러 러너가 동시에 써도 Go가 잠금을 건다.
      # 잡 사이에 남으므로 InfraLens 저장소를 공개로 바꾸기 전에 이 스케일 셋과 함께 없앤다(위 4행). 비우려면 노드에서 이 디렉터리를 지운다.
      - name: go-cache
        hostPath:
          path: /var/lib/ci-cache/go
          type: DirectoryOrCreate
      # 브라우저 버전마다 약 0.5~1GB. 자동 정리는 없다(오래된 버전 디렉터리는 수동 정리, 점검 때 크기 확인)
      - name: playwright-cache
        hostPath:
          path: /var/lib/ci-cache/ms-playwright
          type: DirectoryOrCreate
      - name: work
        emptyDir:
          sizeLimit: 20Gi
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: dind-storage              # 이미지·빌드 캐시. 러너가 지워지면 함께 사라진다
        emptyDir:
          sizeLimit: 40Gi
