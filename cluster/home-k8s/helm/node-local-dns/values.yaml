# chart: deliveryhero/node-local-dns 2.9.2 (k8s-dns-node-cache 1.26.7, OCI ghcr.io/deliveryhero/helm-charts)  (Argo CD app: argocd/applications/node-local-dns.yaml)
# kube-proxy가 없는(Cilium KPR) 클러스터용 구성: iptables·dummy 인터페이스를 쓰지 않고(일반 Pod, hostNetwork 아님),
# CiliumLocalRedirectPolicy(manifests/node-local-dns/lrp.yaml)가 kube-dns(172.16.0.10) 트래픽을 같은 노드의 이 Pod로 보낸다.
# 캐시 미스는 node-local-dns-upstream 서비스(CoreDNS 직접)로 보내므로 리다이렉트 루프가 없다.
config:
  dnsDomain: cluster.local
  dnsServer: "172.16.0.10"      # kube-dns ClusterIP
  localDns: "169.254.20.10"     # setupInterface=false라 실제로 쓰이지 않음(차트 필수 값)
  bindIp: false                 # 0.0.0.0에 바인드
  setupInterface: false
  setupIptables: false          # → hostNetwork: false
  skipTeardown: true
  # 외부 이름(.:53)은 공용 DNS를 먼저 쓴다. 기본값(__PILLAR__UPSTREAM__SERVERS__)은 노드 resolv.conf의 공유기 192.168.50.1 하나라,
  # 공유기가 일부 질의에 답하지 않을 때 러너에 EAI_AGAIN이 났다(2026-10-20). 공유기는 맨 뒤 예비로만 둔다.
  # 클러스터가 쓰는 *.awx.kr 이름은 공개 레코드라 공용 DNS도 같은 사설 IP(192.168.50.200)를 돌려준다. 공유기 전용 영역이 생기면 extraServerBlocks로 따로 보낸다.
  upstreamServers: "1.1.1.1 8.8.8.8 192.168.50.1"
  upstreamForwardConfig:
    policy: policy sequential    # 앞에서부터 쓰고, 실패한 서버만 건너뛴다(차트가 값만 그대로 넣는다)
  # 상위 DNS가 답하지 않을 때만 만료된 캐시로 답한다(verify). 차트 구조상 cluster.local 등 모든 블록의 cache에 함께 적용된다.
  serveStale:
    enabled: true
    duration: "1h"
    mode: verify

# 차트가 ConfigMap 체크섬을 Pod에 넣지 않아 Corefile만 바꾸면 Pod가 다시 뜨지 않는다. config를 바꿀 때 이 값도 바꿔 롤링 재시작한다
# (maxUnavailable 10% → 한 노드씩. 그 노드의 Pod가 없는 동안 LRP가 원래 kube-dns로 보낸다).
podAnnotations:
  node-local-dns/config-rev: "2026-10-20-public-upstream"
