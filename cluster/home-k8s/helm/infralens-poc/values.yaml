# chart: jangjaelee/infralens(비공개) deploy/helm/infralens 0.10.0 @ 585dba4 (태그 v0.10.0, 이미지 0.10.0)  (Argo CD app: argocd/applications/infralens-poc.yaml)
# InfraLens PoC 설치. 릴리스된 제품을 GitOps로 설치하는 상황을 가정한다. 값은 Helm 릴리스 rev 9와 같다(image.tag 제외).
# 비밀값은 없다. existingSecret은 Secret 이름만 가리키고, Secret은 InfraLens 쪽이 infralens ns에 만든다.
# image.tag는 여기 두지 않는다: 릴리스 차트는 appVersion을 쓰고, 커밋으로 올릴 때는 Application의 helm.parameters에 둔다.
# 이미지 레지스트리: Docker Hub(docker.io/cine0831) 대신 GHCR(Public 패키지, Pull Secret 불필요). 2026-10-23 사용자 결정(D245 레지스트리 B)
image:
  registry: ghcr.io/jangjaelee
app:
  enabled: true
  publicUrl: https://infralens.awx.kr
  sso:
    adminSubjects:
    - CiQwMDAwMDAwMC0wMDAwLTAwMDAtMDAwMC0wMDAwMDAwMDAwMDESBWxvY2Fs
    allowAllUsers: true
    ca:
      existingSecret: infralens-gw-ca
      key: ca.crt
    clientId: infralens
    clientSecret:
      existingSecret: infralens-sso
    issuer: https://infralens.awx.kr/dex
  trustedProxyCIDRs:
  - 10.0.0.0/16
database:
  app:
    existingSecret: infralens-db-app
  loader:
    existingSecret: infralens-db-loader
  migrator:
    existingSecret: infralens-db-migrator
  llm:
    existingSecret: infralens-db-llm           # AI 채팅 전용 DB 계정(키 url)
encryption:
  existingSecret: infralens-encryption
rbac:
  inClusterCollector:
    enabled: true
routing:
  gateway:
    enabled: true
    parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio-gateway
      namespace: istio-system
      sectionName: https-infralens
web:
  enabled: true
# 게이트웨이 시작 때 Map 기본 종류 14개 + node·event·namespace를 켜 두고 끄지 않는다. 나머지는 1시간 안 보면 끈다.
# 캐시가 idle로 꺼진 뒤 첫 응답이 빈 캐시라 개요(/kube/in-cluster)에서 워크로드가 0으로 보이던 문제를 PoC에서 피한다.
kube:
  # 접근 현황(누가 어떤 권한을 가졌는지). 켜도 렌더링은 app·kube-gateway env INFRALENS_KUBE_ACCESS_ENABLED만 바뀜(새 RBAC 없음). 보는 최소 역할은 차트 기본 admin. 2026-10-21 켬
  access:
    enabled: true
  # SNAT 판정(M9 4a). PoC(home-k8s)는 Cilium이라 Calico IPPool을 읽지 않음 → 수집기 ClusterRole에 ippools 규칙을 넣지 않는다. 2026-10-22 사용자 결정
  snat:
    calico: false
  # Kubernetes 이력 적재(16-2 실측용). 켜면 kube-gateway가 infralens-db-loader 계정으로 10분마다 한 바퀴(동시 2) 적재하고,
  # purge CronJob(매주 일 04:00)이 30일 지난 이력을 지움. 새 RBAC 없음. 2026-10-24 사용자 결정(PoC 이력 적재 켬, 보존 30일)
  history:
    enabled: true
    intervalMinutes: 10
    parallel: 2
    retentionDays: 30
  cache:
    idleStopAfter: 1h
    # 2026-10-29 작은 종류 6개 더함(PM 결정 "종류 숫자 (c)"): 탐색기 왼쪽 종류 숫자가 클릭 전에 비지 않게. 클러스터당 watch +6, 메모리 수 MB(lab2 실측)
    warm: [pod, deployment, replicaset, statefulset, daemonset, job, cronjob, horizontalpodautoscaler, service, endpointslice, ingress, ingressclass, networkpolicy, persistentvolumeclaim, node, event, namespace,
           poddisruptionbudget, priorityclass, runtimeclass, mutatingwebhookconfiguration, validatingwebhookconfiguration, storageclass]
  # (M29 ③) Trivy Operator의 VulnerabilityReport 읽기. 수집기 ClusterRole에 aquasecurity.github.io vulnerabilityreports get·list·watch 추가,
  # 게이트웨이 env INFRALENS_KUBE_SECURITY_TRIVY=true. 쓰기 권한 없음. Trivy는 argocd/applications/trivy-operator.yaml. 2026-11-10 사용자 결정
  security:
    trivy:
      enabled: true
# AI 채팅. API 키는 Secret 이름만 가리킨다(키 api-key, InfraLens 쪽이 infralens ns에 만든다).
# 켜면 API 서버에 LLM env가 붙고 종료 유예가 길어지며(응답 스트림 마무리), 주간 평가 CronJob infralens-llm-eval이 생긴다.
llm:
  enabled: true
  primary: anthropic
  secondary: openai
  anthropic:
    model: claude-sonnet-5-5
    apiKey:
      existingSecret: infralens-llm-anthropic
  openai:
    model: gpt-6-luna
    reasoningEffort: none          # Chat Completions에서 tool을 쓰려면 필요(차트 #355)
    apiKey:
      existingSecret: infralens-llm-openai
  # 비용 절감(2026-10-20, 개인 선불 크레딧이 시간당 약 0.7달러 줄어서): 월 토큰·사용자별 요청 한도를 낮추고 주간 평가를 끈다.
  limits:
    monthlyTokenBudget: 1000000
    userHourly: 10                # 차트 기본 30
    userDaily: 30                 # 차트 기본 200
  eval:
    enabled: false                # 주간 평가 CronJob을 두지 않는다. 필요할 때 사용자 승인 뒤 수동으로 돌린다

# (M42 ③, 2026-11-06 PM 승인) 지표 수집과 침해 신호 경보. kube-prometheus-stack은 release 라벨로 고른다.
# 수신은 기존 Alertmanager 경로(Slack Secret 보류 중이라 화면에만 보일 수 있음). 되돌리기: 둘 다 false
metrics:
  serviceMonitor:
    enabled: true
    labels: { release: kube-prometheus-stack }
  prometheusRule:
    enabled: true
    labels: { release: kube-prometheus-stack }

# (11-13 PM 요청) NAT 지표(CloudWatch·Cloud Monitoring) 읽기. 켜도 운영 설정 nat.metrics.enabled와 대상 스위치를 켜야 읽음(세 겹).
# 읽으면 대상 결제 계정에 지표 읽기 요금이 붙음. 주기 수집(periodic)은 기본 꺼짐 유지
cloudMetrics:
  enabled: true

# (M42, 2026-11-06 PL 위임 결정) 차트 NetworkPolicy. 켜기·끄기는 Application parameters의 networkPolicy.enabled.
# lab2 실측(사이드카 주입 + istio)으로 확인. 되돌리기: parameters networkPolicy.enabled "false"
networkPolicy:
  istio:
    enabled: true           # app·web·kube-gateway에 Istio 사이드카(istiod 15012, 15020·15021)
  trafficSources:
    prometheus:             # in-cluster 대상 prometheus_url(kube-prometheus-stack, 9090)
      to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: prometheus-operator } }
      ports: [9090]
  # (2026-11-12 사용자 결정) Kube 게이트웨이 → Loki(접속 국가의 Loki 관측 원천, http://loki.loki.svc:3100). 되돌리기: 이 목록 삭제
  kubeGatewayExtraEgress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: loki } }
      ports:
        - { protocol: TCP, port: 3100 }
  # 관측 원천 연결 확인은 API 서버(app)가 한다. 없으면 시간 초과(2026-11-12 확인)
  appExtraEgress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: loki } }
      ports:
        - { protocol: TCP, port: 3100 }
