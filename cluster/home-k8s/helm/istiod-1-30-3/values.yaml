# chart: istio/istiod 1.30.3  (Argo CD app: argocd/applications/istiod-1-30-3.yaml)
# 리비전 기반 설치. 워크로드는 네임스페이스/리소스 라벨 istio.io/rev=1-30-3 으로 이 control plane을 선택한다.
revision: 1-30-3
# revision tag default → 이 리비전. 리비전 라벨이 없는 Gateway·GatewayClass 관리, istio-injection=enabled 호환
revisionTags:
  - default
pilot:
  autoscaleMin: 2         # HPA 최소 2 → 차트가 PDB(minAvailable 1)도 생성
  # 레플리카를 서로 다른 노드에 배치. Honor: taint 노드(control-plane, NotReady)는 계산에서 제외 →
  # 가능한 노드가 1대뿐이면 같은 노드에도 뜬다. pod-template-hash: 롤링 중 이전 ReplicaSet Pod는 세지 않음
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          app: istiod
          istio.io/rev: 1-30-3
      matchLabelKeys:
        - pod-template-hash
  cni:
    enabled: true          # istio-init(NET_ADMIN) 대신 istio-cni가 트래픽 가로채기 설정
meshConfig:
  accessLogFile: /dev/stdout
