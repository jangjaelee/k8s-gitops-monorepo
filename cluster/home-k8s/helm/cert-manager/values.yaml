# chart: jetstack/cert-manager v1.20.2  (Argo CD app: argocd/applications/cert-manager.yaml)
# 사설 CA ClusterIssuer는 manifests/cert-manager-issuers/ (앱 cert-manager-issuers)
crds:
  enabled: true      # CRD를 차트로 설치(이전 installCRDs: true, deprecated)
  keep: true         # 차트·앱을 지워도 CRD(와 Certificate 등 리소스)는 남긴다(차트 기본값)
# DNS-01 자체 확인(propagation check)을 공개 재귀 DNS로만 한다. 집 DNS는 awx.kr를 다르게 풀 수 있다
dns01RecursiveNameservers: "1.1.1.1:53,8.8.8.8:53"
dns01RecursiveNameserversOnly: true
# 지표 수집(Certificate 만료·Ready 경보용, manifests/cert-manager-issuers/alerts.yaml)
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
