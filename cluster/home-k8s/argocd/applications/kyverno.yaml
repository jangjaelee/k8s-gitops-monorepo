apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argo-cd
  annotations:
    # policies.kyverno.io CRD 11개가 클라이언트 diff로는 계속 OutOfSync로 보인다(서버 diff는 차이 없음)
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: system
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.9.1
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/cluster/home-k8s/helm/kyverno/values.yaml
    - repoURL: https://github.com/jangjaelee/k8s-gitops-monorepo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true          # Kyverno CRD가 커서 필수
