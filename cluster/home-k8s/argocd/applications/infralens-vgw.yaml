apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infralens-vgw
  namespace: argo-cd
spec:
  project: default                    # 제품(InfraLens) 앱이라 시스템 구성요소(system)와 구분
  source:
    repoURL: https://github.com/jangjaelee/k8s-gitops-monorepo.git
    targetRevision: main
    path: cluster/home-k8s/manifests/infralens-vgw
  destination:
    server: https://kubernetes.default.svc
    namespace: infralens-vgw
  syncPolicy:
    automated:
      prune: false                    # 증적 PVC를 지우지 않게
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
