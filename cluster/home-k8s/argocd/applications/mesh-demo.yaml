apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mesh-demo
  namespace: argo-cd
spec:
  project: system
  source:
    repoURL: https://github.com/jangjaelee/k8s-gitops-monorepo.git
    targetRevision: main
    path: cluster/home-k8s/manifests/mesh-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: mesh-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
