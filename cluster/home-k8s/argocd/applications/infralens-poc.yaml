apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infralens-poc
  namespace: argo-cd
spec:
  project: default                    # 제품(InfraLens) 앱이라 시스템 구성요소(system)와 구분
  sources:
    - repoURL: git@github.com:jangjaelee/infralens.git   # 비공개. 읽기 전용 배포 키 Secret argo-cd/repo-infralens(레포에 넣지 않음, README "InfraLens PoC" 절)
      path: deploy/helm/infralens
      targetRevision: v0.1.0   # 릴리스 태그 고정(main 금지, 커밋 d2f81d9). 이미지는 차트 appVersion(0.1.0)을 따른다
      helm:
        releaseName: infralens
        # image.tag는 두지 않는다. 릴리스 차트는 appVersion이 이미지 태그라 targetRevision 하나로 차트와 이미지가 함께 바뀐다.
        # 릴리스가 아닌 커밋으로 올릴 때는 여기 parameters에 image.tag를 넣는다(values에 넣으면 머지 즉시 sync돼 차트와 어긋남).
        valueFiles:
          - $values/cluster/home-k8s/helm/infralens-poc/values.yaml
    - repoURL: https://github.com/jangjaelee/k8s-gitops-monorepo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: infralens              # 네임스페이스와 차트 밖 리소스(infralens-pg, 비밀 Secret)는 InfraLens 쪽이 관리
  syncPolicy:
    # prune은 이 앱이 추적하는 리소스(차트 렌더링 결과)만 지운다. 차트 밖 infralens-pg·Secret·poc-* Job은 대상이 아니다.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
