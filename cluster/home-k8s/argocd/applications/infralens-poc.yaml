apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infralens-poc
  namespace: argo-cd
spec:
  project: default                    # 제품(InfraLens) 앱이라 시스템 구성요소(system)와 구분
  sources:
    - repoURL: git@github.com:jangjaelee/infralens.git   # 비공개. 읽기 전용 배포 키 Secret argo-cd/repo-infralens(레포에 넣지 않음, README "InfraLens PoC" 절)
      path: deploy/helm/infralens
      targetRevision: 1c3f630fd4e24eb398148984da1ad4910a1a79b1   # 개발 중 커밋 고정(main 금지). 릴리스 때는 태그로 바꾸고 아래 parameters를 지운다
      helm:
        releaseName: infralens
        # 커밋으로 올릴 때는 image.tag를 values 파일이 아니라 여기 둔다. values는 머지 즉시 자동 sync되고 targetRevision은
        # 이 파일을 kubectl apply해야 반영되므로, 따로 두면 그 사이 차트와 이미지가 어긋난다. 릴리스 태그면 appVersion을 쓰므로 두지 않는다.
        parameters:
          - name: image.tag
            value: sha-1c3f630
          # (M19) Istio 사이드카는 app·web·kube-gateway에만 Pod 라벨로 주입한다. DB(infralens-pg)·수집 Job은 넣지 않는다.
          # 차트 0.2.0(8ed8e3c)부터 있는 키라 values 파일에 두면 머지 직후 옛 차트로 sync되며 스키마 오류가 나므로 여기 둔다
          - name: app.podLabels.sidecar\.istio\.io/inject
            value: "true"
            forceString: true
          - name: web.podLabels.sidecar\.istio\.io/inject
            value: "true"
            forceString: true
          - name: kube.gateway.podLabels.sidecar\.istio\.io/inject
            value: "true"
            forceString: true
          # 사이드카 자원: 메모리 limit만 Istio 기본 1Gi → 256Mi(실사용 약 45~57Mi, 2026-10-27 PM 결정).
          # proxyMemoryLimit만 주면 Istio가 CPU request·limit을 빼고 memory request도 256Mi로 올리므로 나머지 기본값을 같이 적는다
          - name: app.podAnnotations.sidecar\.istio\.io/proxyCPU
            value: "100m"
            forceString: true
          - name: app.podAnnotations.sidecar\.istio\.io/proxyMemory
            value: "128Mi"
            forceString: true
          - name: app.podAnnotations.sidecar\.istio\.io/proxyCPULimit
            value: "2"
            forceString: true
          - name: app.podAnnotations.sidecar\.istio\.io/proxyMemoryLimit
            value: "256Mi"
            forceString: true
          - name: web.podAnnotations.sidecar\.istio\.io/proxyCPU
            value: "100m"
            forceString: true
          - name: web.podAnnotations.sidecar\.istio\.io/proxyMemory
            value: "128Mi"
            forceString: true
          - name: web.podAnnotations.sidecar\.istio\.io/proxyCPULimit
            value: "2"
            forceString: true
          - name: web.podAnnotations.sidecar\.istio\.io/proxyMemoryLimit
            value: "256Mi"
            forceString: true
          - name: kube.gateway.podAnnotations.sidecar\.istio\.io/proxyCPU
            value: "100m"
            forceString: true
          - name: kube.gateway.podAnnotations.sidecar\.istio\.io/proxyMemory
            value: "128Mi"
            forceString: true
          - name: kube.gateway.podAnnotations.sidecar\.istio\.io/proxyCPULimit
            value: "2"
            forceString: true
          - name: kube.gateway.podAnnotations.sidecar\.istio\.io/proxyMemoryLimit
            value: "256Mi"
            forceString: true
          # 사이드카 뒤에서는 접속 주소가 127.0.0.6이 되므로 XFF를 믿을 대역에 더한다(values 파일의 목록을 통째로 바꿈, nginx real_ip도 같은 목록)
          - name: app.trustedProxyCIDRs
            value: "{10.0.0.0/16,127.0.0.6/32}"
          # (M19) 트래픽 탭(Hubble·Istio 원천) 스위치
          - name: kube.traffic.enabled
            value: "true"
        valueFiles:
          - $values/cluster/home-k8s/helm/infralens-poc/values.yaml
    - repoURL: https://github.com/jangjaelee/k8s-gitops-monorepo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: infralens              # 네임스페이스와 차트 밖 리소스(infralens-pg, 비밀 Secret)는 InfraLens 쪽이 관리
  syncPolicy:
    # prune은 이 앱이 추적하는 리소스(차트 렌더링 결과)만 지운다. 차트 밖 infralens-pg·Secret·poc-* Job은 대상이 아니다.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
