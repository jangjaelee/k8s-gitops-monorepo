apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infralens-poc
  namespace: argo-cd
  annotations:
    # 차트 HTTPRoute backendRefs에 API 서버 기본값(group, kind, weight)이 빠져 클라이언트 diff가 계속 OutOfSync로 본다
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default                    # 제품(InfraLens) 앱이라 시스템 구성요소(system)와 구분
  sources:
    - repoURL: git@github.com:jangjaelee/infralens.git   # 비공개. 읽기 전용 배포 키 Secret argo-cd/repo-infralens(레포에 넣지 않음, README "InfraLens PoC" 절)
      path: deploy/helm/infralens
      targetRevision: 985f771983ebea4bdd7e084df906a9a374324dbe   # 차트 커밋 고정(main 금지). 아래 image.tag와 같은 PR에서 올린다
      helm:
        releaseName: infralens
        # image.tag를 values 파일이 아니라 여기에 둔다. values는 머지 즉시 자동 sync되고 targetRevision은 이 파일을
        # kubectl apply해야 반영되므로, 따로 두면 그 사이 "새 이미지 + 옛 차트"로 돈다. 한 파일이면 apply 한 번에 함께 바뀐다.
        parameters:
          - name: image.tag
            value: sha-0559e78
        valueFiles:
          - $values/cluster/home-k8s/helm/infralens-poc/values.yaml
    - repoURL: https://github.com/jangjaelee/k8s-gitops-monorepo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: infralens              # 네임스페이스와 차트 밖 리소스(infralens-pg, 비밀 Secret)는 InfraLens 쪽이 관리
  syncPolicy:
    # prune은 이 앱이 추적하는 리소스(차트 렌더링 결과)만 지운다. 차트 밖 infralens-pg·Secret·poc-* Job은 대상이 아니다.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
