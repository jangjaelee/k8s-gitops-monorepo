apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argo-cd
  annotations:
    # cert-controller가 webhook caBundle·Secret 데이터를 런타임에 채운다
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: system
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.13.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/cluster/home-k8s/helm/external-secrets/values.yaml
    - repoURL: https://github.com/jangjaelee/k8s-gitops-monorepo.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/jangjaelee/k8s-gitops-monorepo.git
      targetRevision: main
      path: cluster/home-k8s/manifests/external-secrets   # ClusterSecretStore vault
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
