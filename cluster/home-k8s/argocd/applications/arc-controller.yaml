apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-controller
  namespace: argo-cd
spec:
  project: system
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts   # OCI (argocd/repositories/arc-oci.yaml 등록 필요)
      chart: gha-runner-scale-set-controller
      targetRevision: 0.15.0          # 러너 스케일 셋 앱(arc-infralens)의 차트와 같은 버전이어야 한다
      helm:
        releaseName: arc
        valueFiles:
          - $values/cluster/home-k8s/helm/arc-controller/values.yaml
    - repoURL: https://github.com/jangjaelee/k8s-gitops-monorepo.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/jangjaelee/k8s-gitops-monorepo.git
      targetRevision: main
      path: cluster/home-k8s/manifests/arc-controller   # 네임스페이스 arc-systems, arc-runners
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
