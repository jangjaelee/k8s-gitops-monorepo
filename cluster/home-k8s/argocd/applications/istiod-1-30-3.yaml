apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod-1-30-3
  namespace: argo-cd
spec:
  project: system
  sources:
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: istiod
      targetRevision: 1.30.3
      helm:
        releaseName: istiod-1-30-3
        valueFiles:
          - $values/cluster/home-k8s/helm/istiod-1-30-3/values.yaml
    - repoURL: https://github.com/jangjaelee/k8s-gitops-monorepo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  # istiod가 webhook caBundle을 주입하고 validator failurePolicy를 바꾼다
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istio-validator-1-30-3-istio-system
      jqPathExpressions:
        - .webhooks[]?.failurePolicy
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: istio-sidecar-injector-1-30-3
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: istio-revision-tag-default
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
