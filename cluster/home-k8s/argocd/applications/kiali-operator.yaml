apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali-operator
  namespace: argo-cd
spec:
  project: o11y
  sources:
    - repoURL: https://kiali.org/helm-charts
      chart: kiali-operator
      targetRevision: 2.33.0
      helm:
        releaseName: kiali-operator
        valueFiles:
          - $values/cluster/home-k8s/helm/kiali-operator/values.yaml
    - repoURL: https://github.com/jangjaelee/k8s-gitops-monorepo.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kiali-operator         # Kiali CR·서버는 cr.namespace(istio-system)에 생긴다
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
