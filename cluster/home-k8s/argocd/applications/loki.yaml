apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argo-cd
spec:
  destination:
    namespace: loki
    server: https://kubernetes.default.svc
  project: o11y
  sources:
    - chart: loki
      helm:
        releaseName: loki
        valueFiles:
          - $values/cluster/home-k8s/helm/loki/values.yaml
      repoURL: https://grafana.github.io/helm-charts
      targetRevision: 7.6.0
    - ref: values
      repoURL: https://github.com/jangjaelee/k8s-gitops-monorepo.git
      targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
