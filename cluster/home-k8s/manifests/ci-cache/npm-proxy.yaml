# npm 받기 캐시(Verdaccio 프록시). 러너의 npm_config_registry가 이 Service를 가리킨다. 받은 패키지 tarball·메타데이터는 hostPath에 남는다.
# 업링크는 registry.npmjs.org 하나뿐이고 게시(publish)는 막는다(읽기 전용). 웹 UI는 끈다. 프록시가 죽으면 npm install이 실패하니 npm_config_registry를 비우면 npmjs로 바로 간다.
# 저장소는 CI 전용 worker-node-04의 hostPath(/var/lib/ci-cache/npm-proxy)라 Pod는 그 노드에만 뜬다. Service는 클러스터 어느 노드의 러너에서든 닿는다.
# 인증·TLS 없이 HTTP다. 들어오는 연결은 NetworkPolicy(network-policy.yaml)로 arc-runners 러너에서만 연다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: npm-proxy-config
  namespace: ci-cache
  labels:
    app.kubernetes.io/part-of: ci-cache
data:
  config.yaml: |
    storage: /verdaccio/storage
    web:
      enable: false                   # 웹 UI 끔(API만)
    auth:
      htpasswd:
        file: /verdaccio/storage/htpasswd
        max_users: -1                 # 사용자 등록 막음
    uplinks:
      npmjs:
        url: https://registry.npmjs.org/
        cache: true                   # 받은 메타데이터·tarball을 보존한다
    packages:
      '@*/*':
        access: $all
        publish: nobody               # 없는 그룹 = 아무도 게시 못 함
        unpublish: nobody
        proxy: npmjs
      '**':
        access: $all
        publish: nobody
        unpublish: nobody
        proxy: npmjs
    # npm audit 요청(/-/npm/v1/security/*)을 npmjs로 넘긴다(Verdaccio 내장 audit 미들웨어). 없으면 npm audit이 실패한다(11-22)
    middlewares:
      audit:
        enabled: true
    log:
      type: stdout
      format: pretty
      level: warn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: npm-proxy
  namespace: ci-cache
  labels:
    app.kubernetes.io/name: npm-proxy
    app.kubernetes.io/part-of: ci-cache
spec:
  replicas: 1
  strategy:
    type: Recreate                    # hostPath 하나를 두 Pod가 함께 쓰지 않게
  selector:
    matchLabels:
      app.kubernetes.io/name: npm-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: npm-proxy
        app.kubernetes.io/part-of: ci-cache
      annotations:
        ci-cache/config-rev: "2"        # npm-proxy-config를 바꾸면 올린다(롤링 재시작)
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/ci: ""
        kubernetes.io/hostname: worker-node-04   # hostPath가 이 노드에 있다. CI 노드가 늘어도 옮겨 가지 않게
      tolerations:
        - key: dedicated
          operator: Equal
          value: ci
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000             # cleanup CronJob(uid 1000)이 지울 수 있게 레지스트리와 같은 사용자
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # hostPath는 root 소유로 만들어지므로 Verdaccio 사용자(1000)에게 디렉터리만 넘긴다
        - name: init-dir
          image: &npmProxyImage docker.io/verdaccio/verdaccio:6.10.7@sha256:d394c36d62a62d264cf5566eabe323050f3e0a3f6455ccff9c355fcbfcb28073
          command: ["chown", "1000:1000", "/verdaccio/storage"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /verdaccio/storage
      containers:
        - name: verdaccio
          image: *npmProxyImage
          ports:
            - name: http
              containerPort: 4873
          readinessProbe:
            httpGet:
              path: /-/ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/ping
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /verdaccio/storage
            - name: config
              mountPath: /verdaccio/conf/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: npm-proxy-config
        - name: data
          hostPath:
            path: /var/lib/ci-cache/npm-proxy
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: npm-proxy
  namespace: ci-cache
  labels:
    app.kubernetes.io/name: npm-proxy
    app.kubernetes.io/part-of: ci-cache
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: npm-proxy
  ports:
    - name: http
      port: 4873
      targetPort: http
