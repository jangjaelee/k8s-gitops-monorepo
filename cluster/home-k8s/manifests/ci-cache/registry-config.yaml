# 두 레지스트리 공통 설정. 이미지 기본 설정과 다른 점:
# - storage.cache(blobdescriptor inmemory)를 두지 않는다. cleanup CronJob이 실행 중에 파일을 지워도 레지스트리가 없는 blob을 있다고 보지 않게
# - log.level info(기본 debug)
# 미러의 프록시 설정은 registry-mirror.yaml의 env(REGISTRY_PROXY_*)로 덧붙인다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: ci-cache
  labels:
    app.kubernetes.io/part-of: ci-cache
data:
  config.yml: |
    version: 0.1
    log:
      level: info
      fields:
        service: registry
    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: true
    http:
      addr: :5000
