# Gateway istio-gateway의 infrastructure.parametersRef (gateway.yaml)
# Istio가 자동 생성하는 리소스에 덮어쓸 값. replicas 2(노드 분산) + PDB로 노드 하나가 빠져도 인그레스 유지.
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-gateway-options
  namespace: istio-system
data:
  deployment: |
    spec:
      replicas: 2
      template:
        spec:
          # 레플리카를 서로 다른 노드에 배치 (istiod values와 같은 규칙)
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              nodeTaintsPolicy: Honor
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: istio-gateway
              matchLabelKeys:
                - pod-template-hash
  podDisruptionBudget: |
    spec:
      minAvailable: 1
