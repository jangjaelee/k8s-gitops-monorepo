# Cilium LB IPAM(192.168.50.200) → Service(LoadBalancer) → Istio Gateway Pod
# HTTP :80, HTTPS :443(home.awx.kr, www.home.awx.kr — 사설 CA 인증서 certificate.yaml)
# 호스트 전용 listener: vault.awx.kr(https-vault), argocd.awx.kr(https-argocd), infralens.awx.kr(https-infralens)
# Istio가 이 Gateway를 보고 istio-system에 Deployment·Service(istio-gateway-istio)를 자동 생성한다.
# 네임스페이스 istio-system은 istio-base/istiod 앱이 만든다(CreateNamespace).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-gateway
  namespace: istio-system
  labels:
    istio.io/rev: 1-30-3          # 이 Gateway를 관리할 Istio control plane 리비전
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "192.168.50.200"   # 자동 생성되는 Service에 전달됨
    parametersRef:                  # 자동 생성 Deployment·PDB 설정 (gateway-options.yaml)
      group: ""
      kind: ConfigMap
      name: istio-gateway-options
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""                     # API 서버 기본값과 맞춤(없으면 Argo CD가 OutOfSync로 봄)
            kind: Secret
            name: istio-gateway-tls       # certificate.yaml (cert-manager)
      allowedRoutes:
        namespaces:
          from: All
    - name: https-vault             # vault.awx.kr 전용 (SNI로 구분, 전용 인증서)
      hostname: vault.awx.kr
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: vault-gateway-tls       # certificate-vault.yaml
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: vault
    - name: https-argocd            # argocd.awx.kr 전용 (SNI로 구분, 전용 인증서)
      hostname: argocd.awx.kr
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: argocd-gateway-tls      # certificate-argocd.yaml
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argo-cd
    - name: https-infralens         # infralens.awx.kr 전용 (SNI로 구분, 공용 *.awx.kr 인증서). HTTPRoute는 InfraLens 쪽이 관리
      hostname: infralens.awx.kr
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: istio-gateway-tls       # certificate.yaml (*.awx.kr)
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: infralens-test   # 백엔드 시험 설치. PoC(infralens)로 옮기면 이 값을 바꾼다
