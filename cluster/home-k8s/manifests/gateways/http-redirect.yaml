# http://vault.awx.kr, http://argocd.awx.kr → https (301)
# Gateway의 http(:80) listener에만 붙는다. home.awx.kr는 HTTP 테스트용으로 남겨 둔다.
# 새 HTTPS 전용 호스트를 추가하면 hostnames에도 넣는다.
# group/kind/matches는 API 서버 기본값을 그대로 적어 둔다(없으면 Argo CD가 OutOfSync로 봄).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: istio-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio-gateway
      namespace: istio-system
      sectionName: http
  hostnames:
    - vault.awx.kr
    - argocd.awx.kr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
