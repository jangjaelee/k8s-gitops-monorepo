# PoC DB 덤프 저장소. DB(worker-node-01)와 다른 노드에 두려고 CronJob이 worker-node-02로 고정된다(local-path는 첫 Pod 노드에 묶임).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: infralens-db-backup
  namespace: infralens
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
