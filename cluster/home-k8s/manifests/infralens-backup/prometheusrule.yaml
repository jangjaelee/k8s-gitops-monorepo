# PoC 최소 경보. infralens_alert="critical"만 Alertmanager가 Slack으로 보낸다(helm/prometheus-operator/values.yaml). 인증서 만료는 cert-manager 지표 수집을 켠 뒤 추가한다.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: infralens-poc-minimal
  namespace: infralens
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: infralens-poc
      rules:
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true",node!="worker-node-05"} == 0   # 05는 꺼 둠
          for: 5m
          labels: { infralens_alert: critical }
          annotations: { summary: "노드 {{ $labels.node }} NotReady" }
        - alert: NodeDiskLow
          expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15
          for: 15m
          labels: { infralens_alert: critical }
          annotations: { summary: "{{ $labels.instance }} 디스크 여유 15% 미만" }
        - alert: InfraLensDatabaseDown
          expr: kube_statefulset_status_replicas_ready{namespace="infralens",statefulset="infralens-pg"} < 1
          for: 5m
          labels: { infralens_alert: critical }
          annotations: { summary: "PoC DB 준비 안 됨" }
        - alert: InfraLensWorkloadUnavailable
          expr: kube_deployment_status_replicas_available{namespace="infralens"} < 1
          for: 5m
          labels: { infralens_alert: critical }
          annotations: { summary: "{{ $labels.deployment }} 가용 Pod 없음" }
        - alert: InfraLensPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="infralens"}[15m]) > 3
          for: 5m
          labels: { infralens_alert: critical }
          annotations: { summary: "{{ $labels.pod }} 재시작 반복" }
        - alert: InfraLensBackupStale
          expr: time() - kube_cronjob_status_last_successful_time{namespace="infralens",cronjob="infralens-db-backup"} > 93600
          for: 10m
          labels: { infralens_alert: critical }
          annotations: { summary: "PoC DB 백업 성공이 26시간 넘게 없음" }
        - alert: InfraLensRestoreTestStale
          expr: time() - kube_cronjob_status_last_successful_time{namespace="infralens",cronjob="infralens-db-restore-test"} > 691200
          for: 10m
          labels: { infralens_alert: critical }
          annotations: { summary: "PoC 복원 시험 성공이 8일 넘게 없음" }
        - alert: InfraLensCollectorFailed
          expr: kube_job_status_failed{namespace="infralens",job_name=~"infralens-collector-.*"} > 0
          for: 5m
          labels: { severity: warning }   # 처음엔 critical만 통보. 통보 안 함
          annotations: { summary: "수집 Job {{ $labels.job_name }} 실패" }
