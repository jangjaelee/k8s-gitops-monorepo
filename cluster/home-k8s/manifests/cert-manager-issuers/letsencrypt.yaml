# Let's Encrypt 발급자(DNS-01, 인터넷 인바운드 없음)
# hosting.kr에 _acme-challenge.infralens.awx.kr CNAME → acme-dns fulldomain 위임. acme-dns 계정은 acme-dns-account.yaml
# ACME 계정 키 Secret(letsencrypt-*-account-key)은 cert-manager가 만든다
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cnameStrategy: Follow
          acmeDNS:
            host: https://auth.acme-dns.io
            accountSecretRef:
              name: acme-dns-account
              key: acmedns.json
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cnameStrategy: Follow
          acmeDNS:
            host: https://auth.acme-dns.io
            accountSecretRef:
              name: acme-dns-account
              key: acmedns.json
