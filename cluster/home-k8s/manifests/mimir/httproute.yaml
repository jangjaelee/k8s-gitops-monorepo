# https://mimir.awx.kr → Istio Gateway(192.168.50.200, listener https-mimir) → Service mimir/mimir-gateway:8080(basic auth)
# group/kind/weight/matches는 API 서버 기본값을 그대로 적어 둔다(없으면 Argo CD가 OutOfSync로 봄).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mimir
  namespace: mimir
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio-gateway
      namespace: istio-system
      sectionName: https-mimir
  hostnames:
    - mimir.awx.kr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: mimir-gateway
          port: 8080
          weight: 1
