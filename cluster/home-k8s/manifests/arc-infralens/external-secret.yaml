# 러너 스케일 셋 arc-infralens의 GitHub App 자격 증명 (helm/arc-infralens/values.yaml의 githubConfigSecret)
# App은 jangjaelee/infralens 저장소 하나에만 설치한다. 권한: Repository Administration(Read and write), Metadata(Read)
# 값은 Vault secret/arc-infralens/github-app(KV v2)에 둔다(레포 밖). 넣는 방법은 README "ARC".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-infralens-github-app
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: arc-infralens-github-app
  data:
    - secretKey: github_app_id              # App ID 또는 Client ID
      remoteRef:
        key: arc-infralens/github-app
        property: github_app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: arc-infralens/github-app
        property: github_app_installation_id
    - secretKey: github_app_private_key     # PEM 전체
      remoteRef:
        key: arc-infralens/github-app
        property: github_app_private_key
