# 클러스터 전체에서 쓰는 Vault 저장소. ExternalSecret에서 secretStoreRef: {kind: ClusterSecretStore, name: vault}
# Vault 쪽 설정(레포 밖, Vault API): KV v2 `secret/`, auth `kubernetes/`, 정책 `eso-read`(secret/data/* read),
# 역할 `external-secrets`(SA external-secrets/external-secrets만 허용). 명령은 README "Vault" 절.
# CRD가 같은 앱에서 설치되므로 dry-run을 건너뛰고 차트 리소스 다음(wave 1)에 적용한다.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200     # 클러스터 내부 HTTP(TLS는 Gateway에서만)
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
