# https://vault.awx.kr → Istio Gateway(192.168.50.200, listener https-vault) → Service vault:8200
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
  namespace: vault
spec:
  parentRefs:
    - name: istio-gateway
      namespace: istio-system
      sectionName: https-vault
  hostnames: ["vault.awx.kr"]
  rules:
    - backendRefs:
        - name: vault
          port: 8200
