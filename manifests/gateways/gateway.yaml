# Cilium LB IPAM(192.168.50.201) → Service(LoadBalancer) → Istio Gateway Pod
# Istio가 이 Gateway를 보고 Deployment·Service(istio-gateway-istio)를 자동 생성한다.
apiVersion: v1
kind: Namespace
metadata:
  name: gateways
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-gateway
  namespace: gateways
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "192.168.50.201"   # 자동 생성되는 Service에 전달됨
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
