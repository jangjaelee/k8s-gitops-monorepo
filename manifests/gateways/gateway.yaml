# Cilium LB IPAM(192.168.50.200) → Service(LoadBalancer) → Istio Gateway Pod
# HTTP :80, HTTPS :443(home.awx.kr, www.home.awx.kr — 사설 CA 인증서 certificate.yaml)
# Istio가 이 Gateway를 보고 istio-system에 Deployment·Service(istio-gateway-istio)를 자동 생성한다.
# 네임스페이스 istio-system은 istio-base/istiod 앱이 만든다(CreateNamespace).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "192.168.50.200"   # 자동 생성되는 Service에 전달됨
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""                     # API 서버 기본값과 맞춤(없으면 Argo CD가 OutOfSync로 봄)
            kind: Secret
            name: istio-gateway-tls       # certificate.yaml (cert-manager)
      allowedRoutes:
        namespaces:
          from: All
