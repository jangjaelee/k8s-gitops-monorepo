# Cilium LB IPAM(192.168.50.201) → Service(LoadBalancer) → Istio Gateway Pod
# Istio가 이 Gateway를 보고 istio-system에 Deployment·Service(istio-gateway-istio)를 자동 생성한다.
# 네임스페이스 istio-system은 istio-base/istiod 앱이 만든다(CreateNamespace).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: "192.168.50.201"   # 자동 생성되는 Service에 전달됨
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
